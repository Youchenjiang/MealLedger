sonar.projectKey=Youchenjiang_MealLedger
sonar.organization=youchenjiang

# Canonical schema and immutable migrations intentionally repeat domain literals
# and full function bodies across revisions. Exclude them from analysis so
# plsql:S1192 noise does not dominate the issue list. Prefer repository RLS
# tests and DeepSource SQL for migration security review.
#
# Note: SonarCloud Automatic Analysis reads .sonarcloud.properties, not this
# file. Keep both in sync for CI scanner and Automatic Analysis.
sonar.exclusions=**/supabase/schema.sql,**/supabase/migrations/**
sonar.cpd.exclusions=**/supabase/schema.sql,**/supabase/migrations/**

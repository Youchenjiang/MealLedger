# Automatic Analysis only honors a small property set (sources/tests/exclusions/
# cpd.exclusions/etc). It does NOT apply sonar.issue.ignore.multicriteria, so
# plsql:S1192 on immutable SQL cannot be suppressed rule-by-rule here.
#
# Exclude the canonical schema mirror and versioned migrations from analysis.
# These files intentionally repeat enum labels, CHECK values, and full
# CREATE OR REPLACE function bodies for reproducible deploy history.
# SQL security review for migrations remains covered by DeepSource SQL and
# repository RLS tests (npm run test:rls).
sonar.exclusions=supabase/schema.sql,supabase/migrations/**,supabase/functions/ai-parse/handler.test.ts
sonar.cpd.exclusions=supabase/schema.sql,supabase/migrations/**,supabase/functions/ai-parse/handler.test.ts
